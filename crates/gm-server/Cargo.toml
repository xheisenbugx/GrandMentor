[package]
name = "gm-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "gm_server"
path = "src/lib.rs"

[[bin]]
name = "grandmentor"
path = "src/main.rs"

[dependencies]
gm-engine.workspace = true
gm-content.workspace = true
gm-bots.workspace = true
gm-analysis.workspace = true
gm-mentor.workspace = true
gm-store.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
shakmaty.workspace = true
axum = { workspace = true, features = ["macros"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["catch-panic"] }
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
futures-util.workspace = true
rand.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tokio-tungstenite = "0.24"
