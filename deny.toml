# cargo-deny configuration: `cargo deny check` (run in CI by the `deny` job).
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Checks: security advisories (RustSec), banned/duplicate crates, crate sources and licenses.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Fail on any RustSec vulnerability, and on unmaintained/unsound crates we use directly or transitively.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Each ignored advisory needs an id and a reason, e.g.
# { id = "RUSTSEC-0000-0000", reason = "not reachable: we never call X" },
ignore = []

[licenses]
# Licenses found in the dependency tree today (`cargo deny list` shows which crate uses which).
#
# The project is licensed GPL-3.0-or-later (see LICENSE): the server links shakmaty
# (GPL-3.0-or-later) and the app ships GPL-licensed piece art.
# Do not add more copyleft licenses without discussing it in the PR.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # rustix, linux-raw-sys, wasi
    "BSD-2-Clause",                   # zerocopy
    "BSD-3-Clause",                   # brotli, if-addrs, matchit, subtle
    "ISC",                            # ring, rustls, untrusted
    "Unicode-3.0",                    # icu_* (via url/idna)
    "Zlib",                           # foldhash, miniz_oxide
    "CDLA-Permissive-2.0",            # webpki-root-certs (Mozilla root store data)
    "GPL-3.0-or-later",               # shakmaty, and our own crates
]
confidence-threshold = 0.93

[licenses.private]
# Our own crates are `publish = false`; still check them against the allowlist.
ignore = false

[bans]
# Several crates exist in two major versions (e.g. base64, cpufeatures, r-efi) because of upstream
# dependencies. Report them, but do not fail the build.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version; that is fine for unpublished crates.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
